<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGMC X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Brand swap 2026-09-25 (CEO-provided): #153804 dark green +
       #f1ede9 beige. Faithful swap, not a full rebrand — --accent keeps
       its existing SUPPORTING role (mascot icon, header mark, subtle
       highlights); the send button and the CEO's own chat bubbles still
       use --text/--bg (near-black/cream), unchanged, per the agreed
       "faithful swap" direction over a bolder full-rebrand option.
       --success is deliberately NOT this same green — it was already a
       distinct enough shade (more teal-leaning) before this change, and
       stays that way on purpose so "Connected"/success states don't lose
       their signal value now that green is also the brand color.
       --surface (panel/dropdown/approval-card background) changed from
       white to match --bg exactly, per direct CEO follow-up — white
       looked disconnected from the new beige page background, and it
       also left --surface-2 (assistant bubble background, #F7F4EE)
       nearly indistinguishable from an all-white panel. Now bubbles
       read as a lighter tone floating on a beige panel, actual contrast
       instead of white-on-white. */
    --bg: #F1EDE9;
    --surface: #F1EDE9;
    --surface-2: #F7F4EE;
    --border: rgba(27,27,29,0.10);
    --border-strong: rgba(27,27,29,0.18);
    --text: #1B1B1D;
    --text-secondary: #6B6D72;
    --text-muted: #9A9C9F;
    --accent: #153804;
    --accent-bg: #E4E9DF;
    --accent-text: #153804;
    /* NOT the same job as --accent-text, despite the similar name —
       found 2026-09-25 while checking dark mode: --accent-text is for a
       dark icon/text sitting on the PALE --accent-bg tint (the header
       mark icon), which is why it's dark. The mascot's own eyes/smile
       are drawn directly ON TOP OF --accent itself (a SOLID dark green
       fill), which needs the OPPOSITE — a light color — or they're
       literally invisible (same color as the circle under them, zero
       contrast, not just low contrast — confirmed via computed styles
       returning identical rgb values for both). White works against
       --accent in both light mode (#153804, very dark) and dark mode
       (#57A230, medium) without needing a separate per-theme value —
       defined once here and left alone in the dark blocks below on
       purpose, same pattern as --header-bg/--status-ok. */
    --accent-fg: #FFFFFF;
    --danger: #A3402D;
    --danger-bg: #F6E4DF;
    --success: #3D6B45;
    --success-bg: #E4EFE3;
    --shadow: 0 20px 50px rgba(20,18,12,0.18), 0 2px 8px rgba(20,18,12,0.08);
    /* Added 2026-09-25, direct CEO follow-up on the brand swap above.
       These four are deliberately theme-INVARIANT (defined once here,
       never overridden in the dark-mode blocks below, so they stay
       constant in both themes) — the header is meant to be a fixed brand
       ribbon, not something that flips look between light/dark mode.
       --status-ok is a brighter green than --accent on purpose: the
       header background IS --accent (#153804), and the same dark green
       used for both header bg and a "connected" dot would barely be
       legible against itself — this is the same brightened green already
       used for --accent in dark mode elsewhere, reused here because the
       reason (dark green needs lifting to read against a dark backdrop)
       is identical. --success itself is untouched and still used as-is
       for approval-card outcomes elsewhere, which sit on light surfaces
       and don't have this problem. */
    --header-bg: #153804;
    --header-fg: #FFFFFF;
    --header-fg-muted: rgba(255,255,255,0.72);
    --status-ok: #57A230;
    --status-warn: #E8B23A;
    /* Chips/+-button/its dropdown menu need their OWN background now
       that --surface matches --bg exactly (added above) — otherwise they
       have no contrast against the panel at all. White in light mode;
       kept at the same shade dark mode's --surface already used, since
       dark mode already had natural contrast here and wasn't part of
       this request. */
    --chip-bg: #FFFFFF;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      /* #153804 is too dark to read against an already-dark background —
         same problem the old gold accent solved by brightening for dark
         mode (#8A6A2F -> #C9A65C). Brightened here the same way, keeping
         the same hue family (a yellow-olive green) rather than reaching
         for a generic/unrelated green, so dark mode still reads as the
         same brand. --bg/--surface/--surface-2 get a subtle green tint
         too (barely perceptible) instead of staying neutral charcoal, for
         the same "still feels on-brand" reason. */
      --bg: #10160D; --surface: #191F16; --surface-2: #1E251B;
      --border: rgba(237,237,238,0.09); --border-strong: rgba(237,237,238,0.16);
      --text: #EDEDEE; --text-secondary: #A2A4AA; --text-muted: #6E7078;
      --accent: #57A230; --accent-bg: rgba(87,162,48,0.14); --accent-text: #78CC4E;
      --danger: #E0796A; --danger-bg: rgba(224,121,106,0.14);
      --success: #7FBB86; --success-bg: rgba(127,187,134,0.14);
      --shadow: 0 20px 50px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
      --chip-bg: #191F16;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10160D; --surface: #191F16; --surface-2: #1E251B;
    --chip-bg: #191F16;
    --border: rgba(237,237,238,0.09); --border-strong: rgba(237,237,238,0.16);
    --text: #EDEDEE; --text-secondary: #A2A4AA; --text-muted: #6E7078;
    --accent: #57A230; --accent-bg: rgba(87,162,48,0.14); --accent-text: #78CC4E;
    --danger: #E0796A; --danger-bg: rgba(224,121,106,0.14);
    --success: #7FBB86; --success-bg: rgba(127,187,134,0.14);
    --shadow: 0 20px 50px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }
  .note {
    text-align: center; font-size: 13px; color: var(--text-muted); padding: 28px 20px 0;
  }

  .mascot {
    position: fixed; right: 24px; bottom: 24px;
    right: calc(24px + env(safe-area-inset-right, 0px));
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent);
    border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); z-index: 10;
    /* padding:0 added 2026-09-25 alongside the logo-image mascot swap —
       a plain <button> has non-zero default UA padding (Chrome: ~1px 6px)
       that was always there but invisible while the mascot's content was
       a small fixed-size SVG just centered inside it. The new logo <img>
       needs to fill 100% of this box exactly (object-fit:cover, clipped
       to a circle), and percentage sizing on a flex child resolves
       against the CONTENT box, so that latent default padding shrank the
       image a few px short of the circle's true edge, leaving a thin
       unfilled ring. If a future change swaps the mascot's content again,
       don't drop this — verify via computed getBoundingClientRect(), not
       a screenshot (this project's own history already found automated
       screenshots of this specific tiny transparent widget unreliable). */
  }
  @media (prefers-reduced-motion: no-preference) {
    .mascot { animation: bob 2.6s ease-in-out infinite; }
    .mascot::before { animation: pulse 2.4s ease-out infinite; }

  }
  .mascot::before {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    background: var(--accent); opacity: 0; z-index: -1;
  }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.45; } 100% { transform: scale(1.7); opacity: 0; } }

  .badge {
    /* Hidden by default — found 2026-09-24: it used to show on every
       fresh page load with nothing behind it, a permanently-on decoration
       rather than a real notification. Now only shown by JS when a reply
       actually finishes arriving while the panel is closed (see send()'s
       completion handling below), and hidden again the moment the panel
       is opened. */
    display: none;
    position: absolute; top: -2px; right: -2px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--danger); border: 2px solid var(--bg);
  }

  .palette {
    position: fixed; right: 24px; bottom: 92px; width: 380px; max-width: calc(100vw - 48px);
    right: calc(24px + env(safe-area-inset-right, 0px));
    background: var(--surface); border: 0.5px solid var(--border-strong);
    border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
    display: none; z-index: 9;
  }
  .palette.open {
    display: block; opacity: 0; transform: translateY(10px) scale(0.97);
    animation: summon 0.28s cubic-bezier(0.2,0.7,0.3,1) forwards;
  }
  @media (prefers-reduced-motion: reduce) { .palette.open { animation: none; opacity: 1; transform: none; } }
  @keyframes summon { to { opacity: 1; transform: translateY(0) scale(1); } }

  /* Desktop-app mode (desktop/main.js — Electron — opens this file with
     #app=1). An earlier pywebview-based shell (desktop_app.py, removed)
     hit real, never-fully-resolved problems here: its transparent= flag
     rendered a solid square regardless, a manual Win32 color-key hack
     ALSO rendered a solid square (WebView2 composites via its own surface
     that bypasses that mechanism entirely), and even Form.Region shape-
     clipping — which did work — sat on top of window sizing that proved
     inconsistent run to run no matter what was tried (DPI-awareness
     fixes, explicit min_size, raw SetWindowPos, a self-correcting
     measure-and-retry loop). Electron's BrowserWindow transparency and
     exact sizing are both just reliable, out of the box — this is one of
     Electron's best-trodden use cases (chat bubbles/overlay widgets).
     Because desktop/main.js sizes the real OS window to EXACTLY match
     the current state (bubble or panel), .mascot/.palette need to fill
     that window edge-to-edge here, not sit at a webpage-style offset
     (right:24px etc.) meant for a much bigger canvas — hence the
     position overrides below. If sizing/shape ever looks wrong again,
     check for a mismatch between these dimensions and main.js's
     BUBBLE_SIZE/PANEL_W/PANEL_H/PANEL_RADIUS constants first. */
  .app-mode .mascot {
    /* Literal 72px, matching main.js's BUBBLE_SIZE, not width/height:100%
       — testing 2026-09-24 whether percentage sizing against the window's
       content box is what's producing a non-circular first paint (the
       captured window bitmap itself is a verified-exact 72x72 square, so
       whatever's producing the oval is inside this element's own CSS
       resolution, not the window). If this fixes it, the container's
       reported 100% width/height isn't trustworthy on the very first
       layout pass in this environment; if it DOESN'T fix it, revert this
       and look at the SVG/eyes/badge children next, not window bounds
       again — already ruled out four times. */
    /* position:relative, NOT static — found 2026-09-24, this was the
       actual root cause of the cold-launch shape bug, nothing to do with
       window bounds or percentage sizing (both already ruled out). .badge
       (a child of .mascot) is `position:absolute; top:-2px; right:-2px`,
       which only means "2px outside THIS BUTTON's corner" if .mascot is
       itself a positioned element — with position:static, that
       containing-block relationship breaks, and .badge instead positions
       against the viewport/window, landing 2px outside the window's own
       top-right corner. That's real page overflow, which is exactly what
       makes Chromium show a native scrollbar — confirmed via a real
       screenshot showing actual scrollbar arrows/thumb squeezed into the
       72x72 window, cropping the circle down to its top-left arc. Also
       explains why one real click permanently fixed it: mascotBtn's click
       handler sets badge.style.display='none' (to hide the notification
       dot) and nothing ever resets it — the first click removes the
       overflowing element from layout for good, so the bug never
       recurred after that. position:relative keeps the same static-like
       layout behavior (no visible offset, since no top/left is set here)
       while correctly re-establishing .mascot as .badge's containing
       block. */
    /* Restored to 56px (matching the base rule's own size) 2026-09-25 —
       the literal 72px here was a leftover from shape-bug debugging
       attempt 5 above ("switched to a literal 72px... also did not fix
       it"), never reverted once the REAL fix (position:relative on this
       same rule) was confirmed. It also silently contradicted main.js's
       own BUBBLE_SIZE comment ("tight around the 56px mascot circle + a
       little breathing room") — a 56px circle in the 72px window is
       exactly that original intent, an 8px margin on every side, not a
       circle stretched edge-to-edge. Restoring it is what makes the bob
       animation below possible again: a translateY bob had nowhere to
       move into with zero margin (any upward motion clipped instantly
       against the window's own physical top edge, which is a hard
       boundary, not a scrollable/expandable canvas). */
    position: relative; width: 56px; height: 56px; inset: auto;
    box-shadow: none; /* --shadow's blur/spread (20px+) is far bigger than the 8px margin above and would still clip harshly right at the window edge — this stays disabled regardless of the animation fix */
  }
  .app-mode .mascot::before { display: none; } /* pulse glow ring stays off — its 6px inset + scale-to-1.7 animation would still clip against the window edge even with the 56px/8px-margin restore above; only the bob motion was asked for */
  .app-mode .palette {
    position: static; width: 100%; height: 100%; max-width: 100%;
    right: auto; bottom: auto; box-shadow: none;
    /* .palette's base `border: 0.5px solid var(--border-strong)` (above)
       is meant to separate the panel from a white webpage background in
       the embedded-widget case — added 2026-09-25, found via a real
       screenshot against a dark desktop wallpaper: that same translucent
       border sits right at the transparent window's own edge here, and
       reads as a visible light outline around the solid green header
       instead of a subtle separation line, since there's no white page
       behind it to blend into. Dropped entirely in app-mode so the header
       is a clean, fully-filled green box with no ring around it. */
    border: none;
  }
  /* body's own opaque `background: var(--bg)` (above) paints the entire
     window rectangle regardless of Electron's real transparent:true — that
     opaque square is what showed through as a square around the round
     bubble, and as visible corners around .palette's own border-radius
     when the panel is open (both reported 2026-09-24). Transparent body is
     what lets the round mascot/palette shapes actually be the window's
     visible silhouette instead of sitting on top of a solid square. */
  .app-mode, .app-mode body { background: transparent; }
  /* Added 2026-09-25 alongside restoring .mascot to 56px (see above) —
     with the button smaller than the window again, plain document flow
     would just plant it at body's top-left corner instead of centered in
     the 72x72 window. Safe with the expanded/panel state too: .palette.open
     is forced to width/height:100% in app-mode (below), so centering a
     flex item that already fills its container is a no-op there — this
     only visibly does anything for the collapsed bubble state. mascotBtn
     is also fully hidden (display:none) via JS whenever the panel is open,
     so body never has to center two visible children at once. */
  .app-mode body { display: flex; align-items: center; justify-content: center; }
  /* Defense-in-depth, added 2026-09-24 alongside the .badge containing-
     block fix above: the widget is a borderless bubble/panel, never a
     scrollable page, so it should never be ABLE to show a native
     scrollbar regardless of what causes overflow — a scrollbar eating
     into a 72x72 window is what turned one small positioning bug into a
     visibly broken shape. .thread keeps its own internal overflow-y:auto
     unaffected (nested scroll context, not the page itself). */
  .app-mode, .app-mode body { overflow: hidden; }
  .app-mode .thread { flex: 1 1 auto; max-height: none; }
  /* .thread:empty{display:none} (below) is meant for the website popup,
     where the palette auto-sizes to its content — an empty thread there
     should collapse rather than leave a blank scroll box. In app-mode the
     palette is a fixed-size real OS window (main.js's PANEL_W/PANEL_H), so
     something has to keep claiming the thread's flex space even with zero
     messages, or the leftover height collapses into a gap below the input
     row instead of sitting between the header and the chips/input, where
     a chat UI's empty state normally goes. */
  .app-mode .thread:empty { display: flex; }
  .app-mode .palette.open { display: flex; flex-direction: column; animation: none; opacity: 1; transform: none; }

  .head {
    /* Solid brand-green header bar, added 2026-09-25 — --header-bg/-fg
       are theme-invariant (see :root), so this looks the same in light
       and dark mode on purpose. No border-bottom anymore — a hard
       neutral-gray line looked like a stray artifact against a solid
       color bar; the color change itself is separation enough. */
    display: flex; align-items: center; gap: 10px; padding: 16px 18px;
    background: var(--header-bg);
  }
  .mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent-bg);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .mark svg { width: 15px; height: 15px; }
  .head-name { font-size: 14px; font-weight: 600; color: var(--header-fg); white-space: nowrap; flex-shrink: 0; }
  .head-status {
    font-size: 12px; color: var(--header-fg-muted); margin-left: auto; display: flex;
    align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    /* Found 2026-09-29: adding the settings gear button crowded the header
       enough that .head-name ("AGMC X") started wrapping onto two lines —
       it had no flex-shrink:0/white-space:nowrap of its own, so the flex
       layout shrank it instead of this. Fixed by pinning head-name (see
       its own rule) and letting THIS element (the least critical piece —
       a connection-status label) be the one that truncates first if the
       header is ever this tight again. */
  }
  /* Model picker - Claude-app style: a small pill beside the send button that
     opens a menu of models (name, one-line description, check on the active
     one). Replaced the header's segmented toggle so the header stays free for
     the connection status. */
  .model-wrap { position: relative; flex: none; }
  .model-pill {
    display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px 0 11px;
    border-radius: 15px; border: 0.5px solid var(--border-strong); background: var(--chip-bg);
    color: var(--text-secondary); font-size: 12.5px; font-family: inherit; cursor: pointer;
    white-space: nowrap;
  }
  .model-pill:hover, .model-pill.open { background: var(--surface-2); color: var(--text); }
  .model-pill:disabled { opacity: 0.5; cursor: default; }
  .model-pill svg { width: 12px; height: 12px; flex: none; transition: transform 0.15s; }
  .model-pill.open svg { transform: rotate(180deg); }
  .model-menu {
    position: absolute; bottom: 40px; right: 0; width: 262px;
    background: var(--chip-bg); border: 0.5px solid var(--border-strong); border-radius: 14px;
    box-shadow: var(--shadow); padding: 6px; display: none; z-index: 12;
  }
  .model-menu.open { display: block; }
  .model-opt {
    display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent;
    padding: 9px 10px; border-radius: 9px; font-family: inherit; text-align: left; cursor: pointer;
    color: var(--text);
  }
  .model-opt:hover { background: var(--surface-2); }
  .model-opt .mo-text { flex: 1; min-width: 0; }
  .model-opt .mo-name { display: block; font-size: 13.5px; font-weight: 600; }
  .model-opt .mo-desc { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 1px; line-height: 1.35; }
  .model-opt .mo-check { width: 16px; height: 16px; flex: none; color: var(--accent); visibility: hidden; }
  .model-opt.active .mo-check { visibility: visible; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--status-ok);
    /* Base/pre-JS default only — checkBackend()/send() in the script
       below set this directly to var(--status-ok) or var(--danger) once
       the real state is known. --status-ok, not --success: a header
       that's ALWAYS dark green needs a BRIGHTER green for this dot to
       actually be legible against it — see the --status-ok comment in
       :root for why. Don't change this back to var(--success) — that's
       the same dark-green-on-dark-green legibility problem this fixes. */
  }
  .close-btn {
    border: none; background: transparent; color: var(--header-fg-muted); cursor: pointer;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .close-btn:hover { background: rgba(255,255,255,0.16); color: var(--header-fg); }
  .close-btn svg { width: 14px; height: 14px; }

  .thread { max-height: 320px; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .thread:empty { display: none; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 84%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.5; overflow-x: auto; }
  .msg.user .bubble { background: var(--accent); color: var(--bg); border-bottom-right-radius: 4px; }
  .msg.assist .bubble { background: var(--surface-2); border: 0.5px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 18px; }
  .bubble li { margin-bottom: 3px; }
  .bubble strong { font-weight: 600; }
  .bubble code { background: var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .bubble table { border-collapse: collapse; font-size: 12.5px; margin: 6px 0 8px; white-space: nowrap; }
  .bubble table:last-child { margin-bottom: 0; }
  .bubble th, .bubble td { padding: 5px 10px; border: 0.5px solid var(--border-strong); text-align: left; }
  .bubble th { background: var(--surface); font-weight: 600; color: var(--text-secondary); }

  .status-line { font-size: 12.5px; color: var(--text-muted); margin-bottom: 5px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
    animation: typingBounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing span { animation: none; opacity: 0.7; }
  }

  .approval { background: var(--surface-2); border: 0.5px solid var(--border-strong); border-radius: 12px; padding: 12px 14px; max-width: 90%; }
  .approval .a-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .approval .a-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); padding: 3px 0; }
  .approval .a-row span:last-child { color: var(--text); font-weight: 500; }
  /* Long, multi-line values (an email body) don't fit a side-by-side row —
     stack the label above the value instead, like an email client would. */
  .approval .a-row-block { display: block; font-size: 13px; color: var(--text-secondary); padding: 3px 0; }
  .approval .a-row-block > span:first-child { display: block; margin-bottom: 3px; }
  .approval .a-row-block > span:last-child { display: block; color: var(--text); font-weight: 500; white-space: pre-wrap; }
  .approval .a-actions { display: flex; gap: 8px; margin-top: 10px; }
  .approval button { flex: 1; border: none; border-radius: 8px; padding: 7px 0; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .btn-confirm { background: var(--success-bg); color: var(--success); }
  .btn-cancel { background: var(--danger-bg); color: var(--danger); }
  .approval.resolved .a-actions { display: none; }
  .approval .a-outcome { font-size: 13px; font-weight: 500; margin-top: 8px; }
  .a-outcome.ok { color: var(--success); } .a-outcome.no { color: var(--danger); }
  .a-outcome p { margin: 0 0 8px; }
  .a-outcome p:last-child { margin-bottom: 0; }
  .a-outcome .booking-links { list-style: none; margin: 0 0 8px; padding: 0; font-weight: 400; }
  .a-outcome .booking-links:last-child { margin-bottom: 0; }
  .a-outcome .booking-links li { padding: 3px 0; }
  .a-outcome .booking-links a { color: var(--success); font-weight: 600; }

  .actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 18px 14px; }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 20px;
    border: 0.5px solid var(--border-strong); background: var(--chip-bg); font-size: 12.5px;
    color: var(--text-secondary); cursor: pointer; font-family: inherit;
  }
  .chip:hover { background: var(--surface-2); color: var(--text); }
  .chip svg { width: 13px; height: 13px; flex: none; }

  .inputrow { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 0.5px solid var(--border); }
  .inputrow input {
    flex: 1; border: none; background: transparent; font-family: inherit; font-size: 14px;
    color: var(--text); outline: none; padding: 6px 4px;
  }
  .inputrow input::placeholder { color: var(--text-muted); }
  .inputrow input:disabled { opacity: 0.5; }
  .send {
    width: 30px; height: 30px; border-radius: 8px; border: none; background: var(--accent);
    color: var(--accent-fg); display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: filter 0.15s; flex: none;
  }
  .send:hover:not(:disabled) { filter: brightness(1.15); }
  .send:disabled { opacity: 0.5; cursor: default; }
  .send svg { width: 14px; height: 14px; }

  .plus-wrap { position: relative; }
  .plus-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 0.5px solid var(--border-strong);
    background: var(--chip-bg); color: var(--text-secondary); display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex: none; transition: transform 0.15s;
  }
  .plus-btn:hover { background: var(--surface-2); color: var(--text); }
  .plus-btn.open { transform: rotate(45deg); }
  .plus-btn svg { width: 15px; height: 15px; }
  .plus-menu {
    position: absolute; bottom: 40px; left: 0; width: 216px;
    background: var(--chip-bg); border: 0.5px solid var(--border-strong); border-radius: 12px;
    box-shadow: var(--shadow); padding: 6px; display: none; z-index: 11;
  }
  .plus-menu.open { display: block; }
  .plus-item {
    display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent;
    padding: 8px 9px; border-radius: 8px; font-size: 13px; color: var(--text); cursor: pointer;
    font-family: inherit; text-align: left;
  }
  .plus-item:hover { background: var(--surface-2); }
  .plus-item svg { width: 16px; height: 16px; color: var(--text-secondary); flex: none; }

  /* ---- UI pass, 2026-09-30 ------------------------------------------------
     Welcome screen, live progress steps, inbox cards, collapsing shortcut
     chips, new-chat and copy buttons. Colours are all existing theme
     variables — the brief was "the colours are okay, just the overall feel". */

  /* Empty state: a greeting in the thread area, shortcuts as a 2-column grid. */
  .welcome { margin: auto; text-align: center; padding: 8px 12px; }
  .welcome-mark {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 12px; background: var(--accent);
    color: var(--accent-fg); display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600; letter-spacing: 0.02em;
  }
  .welcome-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .welcome-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; line-height: 1.45; }
  .palette:not(.has-chat) .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 18px 16px; }
  .palette:not(.has-chat) .chip { padding: 10px 10px; border-radius: 12px; font-size: 12.5px; gap: 7px; text-align: left; }
  .palette:not(.has-chat) .chip svg { width: 15px; height: 15px; }
  /* "New chat" only makes sense once there is a conversation to leave. */
  .palette:not(.has-chat) .chip-new { display: none; }
  .chip-new { color: var(--accent-text); border-color: var(--accent); }
  /* Once a conversation exists the chips shrink to one scrollable row instead
     of permanently taking a third of the panel. */
  .palette.has-chat .actions {
    flex-wrap: nowrap; overflow-x: auto; padding: 8px 18px 12px; scrollbar-width: none;
    /* overflow makes this flex item's min-height 0, so as the thread grew the
       column squeezed the chip row smaller and smaller — never let it shrink. */
    flex: none;
  }
  .palette.has-chat .actions::-webkit-scrollbar { display: none; }
  .palette.has-chat .chip { flex: none; white-space: nowrap; padding: 7px 13px; }

  /* Live progress while a reply is being worked on. */
  .progress { display: flex; flex-direction: column; gap: 7px; min-width: 190px; }
  .p-step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); }
  .p-step.active { color: var(--text); }
  .p-ico { width: 14px; height: 14px; flex: none; display: flex; align-items: center; justify-content: center; }
  .p-ico svg { width: 13px; height: 13px; color: var(--success); }
  .p-spin {
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border-strong);
    border-top-color: var(--accent); animation: pSpin 0.8s linear infinite;
  }
  @keyframes pSpin { to { transform: rotate(360deg); } }
  .p-time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 12px; }
  .p-hint { font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-top: 2px; }
  @media (prefers-reduced-motion: reduce) { .p-spin { animation-duration: 2.4s; } }

  /* Inbox summary as cards, one per person. */
  .inbox-cards { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .inbox-head { font-size: 12.5px; color: var(--text-secondary); padding: 0 2px; }
  .inbox-card {
    display: flex; gap: 11px; align-items: flex-start; background: var(--surface-2);
    border: 0.5px solid var(--border-strong); border-radius: 12px; padding: 11px 12px;
  }
  .ib-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em;
  }
  .ib-body { min-width: 0; flex: 1; }
  .ib-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .ib-name { font-size: 13.5px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
  .ib-pill {
    font-size: 11px; line-height: 1; padding: 3px 7px; border-radius: 10px; background: var(--accent-bg);
    color: var(--accent-text); font-weight: 500; white-space: nowrap;
  }
  .ib-pill.unread { background: var(--accent); color: var(--accent-fg); }
  .ib-text { font-size: 13px; line-height: 1.45; color: var(--text); margin-top: 4px; overflow-wrap: anywhere; }
  .ib-reply {
    margin-top: 7px; border: none; background: transparent; padding: 0; font: inherit; font-size: 12px;
    font-weight: 600; color: var(--accent-text); cursor: pointer;
  }
  .ib-reply:hover { text-decoration: underline; }

  /* Copy button on assistant replies (appears on hover / keyboard focus). */
  .msg.assist { position: relative; }
  .copy-btn {
    position: absolute; right: 6px; bottom: -9px; width: 24px; height: 24px; border-radius: 7px;
    border: 0.5px solid var(--border-strong); background: var(--chip-bg); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0;
    transition: opacity 0.15s;
  }
  .copy-btn svg { width: 13px; height: 13px; }
  .msg.assist:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
  .copy-btn.done { color: var(--success); opacity: 1; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
const thread = document.getElementById('thread');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const palette = document.getElementById('palette');
const mascotBtn = document.getElementById('mascotBtn');
const badge = document.getElementById('badge');
const closeBtn = document.getElementById('closeBtn');

// desktop_app.py opens this file with #app=1 (a hash fragment, not a query
// string — a file:// URL's query string isn't reliably split from the
// path, it broke WebView2 outright with ERR_FILE_NOT_FOUND; a fragment is
// always client-side-only, so it's the safe form here). See the .app-mode
// CSS above. In this mode desktop_app.py's OS window is the actual thing
// being resized between bubble and panel size — CSS alone can't do that
// for a real frameless window — so mascot/close clicks call its exposed
// expand()/collapse() alongside the normal palette open/close.
//
// desktop/main.js (Electron) is the current desktop shell — replaced an
// earlier pywebview-based one (desktop_app.py, now removed) that hit
// real, unresolved window-transparency and exact-sizing reliability
// problems. window.electronAPI comes from desktop/preload.js's
// contextBridge — never window.pywebview, that API no longer exists.
const isDesktopApp = new URLSearchParams(location.hash.slice(1)).get('app') === '1';
if (isDesktopApp) {
  document.documentElement.classList.add('app-mode');
  // Cold-launch-only bug, found and fixed 2026-09-24: the bubble renders
  // as a squashed ellipse instead of a circle on the very first open,
  // then reliably snaps to a correct circle the moment the CEO opens and
  // closes the panel once. Three attempts to fix this in desktop/main.js
  // by forcing the native OS window's bounds (in different ways) did NOT
  // work — which pointed away from window bounds entirely. What closeBtn's
  // handler below actually does as a side effect (from the giant-mascot-
  // on-scroll fix, also 2026-09-24) is toggle mascotBtn.style.display from
  // 'none' back to '' — forcing the browser to redo the mascot element's
  // layout from scratch. Cold launch never runs that code path, since it
  // only happens after a real expand()/collapse() cycle — which is exactly
  // why a fresh launch shows the bug and a manual click always fixes it.
  // Replicating that same toggle once at startup, before the window is
  // ever shown (main.js's show:false + ready-to-show), applies the same
  // fix without waiting for a real click.
  mascotBtn.style.display = 'none';
  void mascotBtn.offsetHeight; // force a synchronous layout flush between the two writes, not a coalesced no-op
  mascotBtn.style.display = '';
}

mascotBtn.addEventListener('click', () => {
  palette.classList.add('open');
  badge.style.display = 'none';
  input.focus();
  if (isDesktopApp && window.electronAPI) {
    // In app-mode the mascot and palette are both forced to fill 100% of
    // the single real OS window (see .app-mode CSS) rather than being
    // independently positioned like they are on the website popup, where
    // both stay visible together (floating bubble + panel above it) by
    // design. Left unhidden here, the mascot remains a second full-window
    // element stacked above the palette in the body, which just shows up
    // as extra scrollable height — i.e. a giant mascot revealed by
    // scrolling up in the panel.
    mascotBtn.style.display = 'none';
    window.electronAPI.expand();
  }
});

function collapsePanel() {
  palette.classList.remove('open');
  if (isDesktopApp && window.electronAPI) {
    mascotBtn.style.display = '';
    window.electronAPI.collapse();
  }
}
closeBtn.addEventListener('click', collapsePanel);
// Esc minimizes back to the bubble, but only when no menu is open (Esc then
// closes that menu first — see the model picker's own Esc handler).
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !palette.classList.contains('open')) return;
  const menuOpen = document.querySelector('.plus-menu.open, .model-menu.open');
  if (!menuOpen) collapsePanel();
});

const plusBtn = document.getElementById('plusBtn');
const plusMenu = document.getElementById('plusMenu');

plusBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  plusMenu.classList.toggle('open');
  plusBtn.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!plusMenu.contains(e.target) && e.target !== plusBtn) {

// marked.parse's plain <a href="..."> links navigate the popup itself away
// from the conversation (it's a small embedded window, not a full browser
// tab) — force every rendered link to open in a real new tab instead, same
// as the booking-approval card's hand-written links already do.
function renderMarkdown(el, text) {
  el.innerHTML = marked.parse(text);
  el.querySelectorAll('a').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  });
}

// Approval cards below build their HTML by string concatenation, and some
// of the fields (email body, meeting subject, the LLM's own proposal text)
// can contain attacker-influenced content — e.g. a scraped/read email whose
// body was crafted to inject markup. Escape before interpolating, same
// reasoning as forcing target="_blank" above: don't let content the model
// only read back out become something that runs in the CEO's own browser.
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

}

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
function attachCopy(row) {
  if (row.querySelector('.copy-btn')) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'copy-btn';
  btn.setAttribute('aria-label', 'Copy reply');
  btn.title = 'Copy';
  btn.innerHTML = COPY_ICON;
  btn.addEventListener('click', async () => {
    const source = row.querySelector('.bubble, .inbox-cards');
    const text = source ? source.innerText : '';
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    btn.classList.add('done');
    btn.innerHTML = CHECK_ICON;
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = COPY_ICON; }, 1200);
  });
  row.appendChild(btn);
}

// Live progress inside the reply bubble while work is in flight: the steps so
// far (finished ones ticked), the current one with a spinner, and elapsed
// time. The local model can take a minute or more on this PC — dots alone read
// as "stuck". Structure is rebuilt only when a step changes; the timer only
// updates text, so the spinner animation isn't restarted every second.
function createProgress(bubble) {
  const started = Date.now();
  const steps = [];
  let timer = null, timeEl = null, hintEl = null;
  const isLocal = () => !!document.querySelector('.model-opt.active[data-provider="ollama"]');
  const fmt = (s) => s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
  function build() {
    const wrap = document.createElement('div');
    wrap.className = 'progress';
    wrap.setAttribute('role', 'status');
    wrap.setAttribute('aria-live', 'polite');
    steps.forEach((label, i) => {
      const active = i === steps.length - 1;
      const row = document.createElement('div');
      row.className = 'p-step' + (active ? ' active' : '');
      const ico = document.createElement('span');
      ico.className = 'p-ico';
      if (active) {
        const sp = document.createElement('span');
        sp.className = 'p-spin';
        ico.appendChild(sp);
      } else {
        ico.innerHTML = CHECK_ICON;
      }
      const text = document.createElement('span');
      text.textContent = label;
      row.append(ico, text);
      if (active) {
        timeEl = document.createElement('span');
        timeEl.className = 'p-time';
        row.appendChild(timeEl);
      }
      wrap.appendChild(row);
    });
    hintEl = document.createElement('div');
    hintEl.className = 'p-hint';
    hintEl.hidden = true;
    wrap.appendChild(hintEl);
    bubble.replaceChildren(wrap);
    tick();
  }
  function tick() {
    const secs = Math.floor((Date.now() - started) / 1000);
    if (timeEl) timeEl.textContent = fmt(secs);
    if (hintEl && secs >= 12 && isLocal()) {
      hintEl.textContent = 'Running on this PC — the local model can take a minute or two.';
      hintEl.hidden = false;
    }
  }
  return {
    start() { steps.push('Thinking…'); build(); timer = setInterval(tick, 1000); },
    step(label) { if (steps[steps.length - 1] !== label) { steps.push(label); build(); } },
    stop() { if (timer) { clearInterval(timer); timer = null; } },
  };
}

// The inbox summary as one card per person (see orchestrator._inbox_cards_payload).
// Built with textContent only: names and blurbs come from email content.
const AVATAR_COLORS = ['#153804', '#8A6A2F', '#3B4A5A', '#1F5F5B', '#5B3A29'];
function renderInboxCards(container, data) {
  container.className = 'inbox-cards';
  const head = document.createElement('div');
  head.className = 'inbox-head';
  head.textContent = data.total + ' recent email' + (data.total === 1 ? '' : 's') + ' · ' + data.people + (data.people === 1 ? ' person' : ' people');
  const cards = [head];
  for (const s of data.senders) {
    const card = document.createElement('div');
    card.className = 'inbox-card';
    const parts = (s.name || '?').split(/\s+/).filter(Boolean);
    const avatar = document.createElement('div');
    avatar.className = 'ib-avatar';
    avatar.textContent = ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    let h = 0;
    for (const c of s.name || '') h = (h * 31 + c.charCodeAt(0)) >>> 0;
    avatar.style.background = AVATAR_COLORS[h % AVATAR_COLORS.length];
    const body = document.createElement('div');
    body.className = 'ib-body';
    const top = document.createElement('div');
    top.className = 'ib-top';
    const name = document.createElement('span');
    name.className = 'ib-name';
    name.textContent = s.name;
    top.appendChild(name);
    if (s.count > 1) {
      const p = document.createElement('span');
      p.className = 'ib-pill';
      p.textContent = s.count + ' emails';
      top.appendChild(p);
    }
    if (s.unread) {
      const p = document.createElement('span');
      p.className = 'ib-pill unread';
      p.textContent = s.unread + ' unread';
      top.appendChild(p);
    }
    const text = document.createElement('div');
    text.className = 'ib-text';
    text.textContent = s.blurb;
    const reply = document.createElement('button');
    reply.type = 'button';
    reply.className = 'ib-reply';
    reply.textContent = 'Reply';
    reply.addEventListener('click', () => {
      input.value = 'reply to ' + s.name + ' and say ';
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    });
    body.append(top, text, reply);
    card.append(avatar, body);
    cards.push(card);
  }
  container.replaceChildren(...cards);
}

function resolve(card, ok, title) {

}

// Real (non-demo) flight booking approval: Confirm here only ever fetches a
// booking link from our own backend — the actual purchase happens when the
// CEO clicks through and completes it himself on the airline/OTA's site.
function addBookingApproval(booking) {
  const row = document.createElement('div');
  row.className = 'msg assist';
  const card = document.createElement('div');
  card.className = 'approval';
  card.innerHTML = '<div class="a-title">Book flight</div>' +
    [['Airline', booking.airline], ['Route', booking.route], ['Dates', booking.dates], ['Flights', booking.flights], ['Fare', booking.price]]
      .filter(r => r[1])
      .map(r => '<div class="a-row"><span>' + r[0] + '</span><span>' + escapeHtml(r[1]) + '</span></div>').join('') +
    '<div class="a-actions"><button class="btn-confirm">Get booking link</button><button class="btn-cancel">Cancel</button></div>';
  row.appendChild(card);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;

  const confirmBtn = card.querySelector('.btn-confirm');
  const cancelBtn = card.querySelector('.btn-cancel');

  cancelBtn.onclick = () => {
    card.classList.add('resolved');
    const out = document.createElement('div');
    out.className = 'a-outcome no';
    out.textContent = 'Cancelled — nothing was requested.';
    card.appendChild(out);
  };

  confirmBtn.onclick = async () => {
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    confirmBtn.textContent = 'Fetching link…';
    const out = document.createElement('div');
    try {
      const res = await fetch(BOOKING_LINK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID, ignav_id: booking.ignav_id })
      });
      const data = await res.json();
      if (data.ok) {
        out.className = 'a-outcome ok';
        let html = '';

        if (data.note) {
          html += '<p>' + data.note + '</p>';
        }

        if (data.options && data.options.length) {
          // Defense in depth: the proposal card's price/airline/route text
          // came from the model's own reply, not from re-verified data — in
          // principle, injected content could talk it into proposing a valid
          // ignav_id with misleading display text. The ignav_id itself is
          // already hard-validated server-side (see main.py), but cross-check
          // the price too: if what was proposed doesn't match what we just
          // actually found, say so rather than silently trusting the proposal.
          const proposedPrice = parseFloat((booking.price || '').replace(/[^0-9.]/g, ''));
          const realPrice = data.options[0].price_total;
          const priceMismatch = proposedPrice && realPrice != null &&
            Math.abs(proposedPrice - realPrice) / realPrice > 0.05;
          if (priceMismatch) {
            html += '<p><strong>Heads up: the price shown when this was proposed (' + booking.price +
              ') doesn’t match what was just found below — treat the fare details above with caution and verify independently.</strong></p>';
          }
          html += '<p>' + (data.options.length > 1
            ? 'Found ' + data.options.length + ' booking sites carrying this fare — cheapest first:'
            : 'Ready to complete the purchase:') + '</p>';
          const items = data.options.map((opt, i) => {
            const priceStr = opt.price_total != null ? (opt.currency || '') + ' ' + opt.price_total.toLocaleString() : '';
            const homepage = opt.homepage_url
              ? ' (if that link is rejected, try <a href="' + opt.homepage_url + '" target="_blank" rel="noopener">' +
                opt.provider_name + '’s homepage</a> and search manually)'
              : '';
            return '<li><a href="' + opt.url + '" target="_blank" rel="noopener">' +
              (opt.provider_name || 'Provider') + '</a>' + (priceStr ? ' — ' + priceStr : '') +
              (i === 0 ? ' <strong>(cheapest)</strong>' : '') + homepage + '</li>';
          }).join('');
          html += '<ul class="booking-links">' + items + '</ul>' +
            '<p>Click through to complete the purchase yourself, with your own payment method — nothing is booked or charged by this assistant. ' +
            'Note: airline sites sometimes reject these direct links as automated traffic and show a "restricted" or error page — ' +
            'that’s the airline’s bot-detection, not a real problem with the fare; use the homepage fallback above if it happens.</p>';
        }

        if (data.search_links && data.search_links.length) {
          // Deliberately separate from the priced options above: these are
          // plain search-page links we generate ourselves (see
          // flight_tool._generated_search_links) for the same route/dates —
          // reliable (no ad-click session to trigger bot-defense) but NOT
          // price-verified against what Ignav quoted.
          const searchItems = data.search_links.map(l =>
            '<li><a href="' + l.url + '" target="_blank" rel="noopener">' + l.provider_name + '</a></li>'
          ).join('');
          html += '<p>' + (data.options && data.options.length ? 'Or search yourself' : 'Search directly') +
            ' for ' + (booking.route || 'this route') + ', ' + (booking.dates || '') +
            ' (price not guaranteed to match what was quoted' +
            (booking.flights ? ' — look for ' + booking.flights + ' to find the matching result' : '') +
            '):</p>' +
            '<ul class="booking-links">' + searchItems + '</ul>';
        }

        out.innerHTML = html;
      } else {
        out.className = 'a-outcome no';
        out.textContent = data.error || 'Could not get a booking link — please search again.';
      }
    } catch {
      out.className = 'a-outcome no';
      out.textContent = "Could not reach the backend — check uvicorn is running.";
    }
    card.classList.add('resolved');
    card.appendChild(out);
    thread.scrollTop = thread.scrollHeight;
  };
}

function respond(q) {
  const s = q.toLowerCase();
  if (s.includes('inbox') || s.includes('email')) {
    addMsg('Three items need a look: a signed-off Q3 marketing budget from Finance, a scheduling request from the BMW regional office, and a service-department escalation flagged urgent. Everything else is routine.', 'assist');
  } else if (s.includes('meeting') || s.includes('schedule')) {
    addMsg('Found an open slot Tuesday 2:00–2:30pm that works for both calendars.', 'assist');
    addApproval('Send meeting invite', [['With', 'BMW regional distributor'], ['When', 'Tue, 2:00–2:30pm'], ['Location', 'AGMC HQ, Dubai']]);
  } else if (s.includes('flight')) {
    addMsg('Best fare found for the route and dates:', 'assist');
    addApproval('Book flight', [['Route', 'DXB → LHR'], ['Date', 'Tue, direct'], ['Fare', 'AED 3,120, business'], ['Airline', 'Emirates']]);
  } else if (s.includes('hotel')) {
    addMsg('Best available rate for the stay:', 'assist');
    addApproval('Book hotel', [['Property', 'The Berkeley, London'], ['Dates', '3 nights'], ['Rate', 'AED 4,850 total']]);
  } else if (s.includes('social') || s.includes('mention')) {
    addMsg('Instagram: a customer post about the new showroom is getting strong engagement. X: one unresolved complaint thread about a service appointment delay, worth a reply.', 'assist');
  } else {
    addMsg('I can help with email, scheduling, flights, hotels, current offers, or social mentions — try one of the shortcuts above.', 'assist');
  }
}

const BACKEND_URL = 'http://localhost:8000/chat';
const STREAM_URL = 'http://localhost:8000/chat/stream';
const UPLOAD_URL = 'http://localhost:8000/upload';
const BOOKING_LINK_URL = 'http://localhost:8000/booking-link';
const SEND_EMAIL_URL = 'http://localhost:8000/send-email';
const REPLY_EMAIL_URL = 'http://localhost:8000/reply-email';
const REPLY_TARGET_URL = 'http://localhost:8000/reply-target';
const CALENDAR_EVENT_URL = 'http://localhost:8000/calendar-event';
const MODEL_URL = 'http://localhost:8000/model';
const STATUS_URL = 'http://localhost:8000/status';
let SESSION_ID = 'ceo-session-1';  // replaced by "New chat" so the backend starts a fresh conversation
let backendOnline = false;

// Maps orchestrator.TOOLS' real tool names (see orchestrator.py) to a
// friendly status shown while that tool is actually running — driven by
// the real {"status": "<tool>"} SSE event orchestrator.run_stream emits
// right before calling it, not a guess based on which shortcut chip was
// clicked, so it's accurate even when the model picks a different tool
// than the chip implied. Keep this in sync with orchestrator.TOOLS' names.
const TOOL_STATUS_LABELS = {
  read_emails: 'Reading your inbox…',
  open_outlook: 'Opening Outlook…',
  resolve_contact: 'Looking up contact…',
  read_calendar: 'Checking your calendar…',
  list_files: 'Looking for the file…',
  read_local_file: 'Reading the file…',
  get_x_mentions: 'Searching X mentions…',
  search_flights: 'Searching live fares…',
  search_hotels: 'Building hotel links…',
  web_search: 'Searching the web…',
  web_fetch: 'Reading the page…',
  search_web: 'Searching the web…',
  summarize_emails: 'Summarizing your emails…',
  compose_reply: 'Drafting your reply…',
};

function setStatus(color, text, hint) {
  document.getElementById('statusDot').style.background = color;
  const statusText = document.getElementById('statusText');
  statusText.textContent = text;
  statusText.parentElement.title = hint || text;
}

let statusPollTimer = null;

// /health only proves the backend process is running. "Connected" used to
// mean just that, so on the boss's PC it showed green while every reply
// failed (local model not downloaded yet, Claude key out of credit) — the
// dot now also asks /status whether the SELECTED model can actually answer.
async function checkBackend(refresh = false) {
  clearTimeout(statusPollTimer);
  try {
    const res = await fetch('http://localhost:8000/health', { signal: AbortSignal.timeout(2000) });
    backendOnline = res.ok;
  } catch {
    backendOnline = false;
  }
  if (!backendOnline) {
    setStatus('var(--danger)', 'Offline demo');
    // The packaged backend's first cold start can outlast main.js's 15s
    // wait, so keep checking rather than sit on "Offline demo" until a send.
    statusPollTimer = setTimeout(() => checkBackend(), 15000);
    return;
  }
  let ready = false;
  let detail = 'Checking…';
  let hint = '';
  try {
    const res = await fetch(STATUS_URL + (refresh ? '?refresh=true' : ''), { signal: AbortSignal.timeout(12000) });
    const data = await res.json();
    ready = data.ready;
    detail = data.detail;
    hint = data.hint;
  } catch {
    // Leave the "checking" state; the poll below retries.
  }
  setStatus(ready ? 'var(--status-ok)' : 'var(--status-warn)', detail, hint);
  // Keep re-checking while not ready, so e.g. the local model finishing its
  // first-run download flips the dot green without the user doing anything.
  if (!ready) statusPollTimer = setTimeout(() => checkBackend(), 15000);
}
checkBackend();

// Header model toggle (Claude <-> local Ollama) — added 2026-09-28,
// rebuilt as a two-button segmented control 2026-09-29 (direct CEO ask,
// "make the toggle more user-friendly" — a binary choice is clearer as
// two always-visible buttons than a dropdown that has to be opened first
// to see what's even in it). Global on the backend
// (orchestrator._active_provider), not per-session, so this just syncs
// the active button to whatever's actually active on load and flips it
// on click; no client-side state to keep consistent beyond that.
async function initModelToggle() {
  const pill = document.getElementById('modelPill');
  const menu = document.getElementById('modelMenu');
  if (!pill || !menu) return;
  const label = document.getElementById('modelPillLabel');
  const options = Array.from(menu.querySelectorAll('.model-opt'));
  const shortName = (provider) => provider === 'ollama' ? 'Local' : 'Claude';
  const setActive = (provider) => {
    for (const o of options) {
      const on = o.dataset.provider === provider;
      o.classList.toggle('active', on);
      o.setAttribute('aria-checked', on ? 'true' : 'false');
    }
    label.textContent = shortName(provider);
  };
  const activeProvider = () => (options.find(o => o.classList.contains('active')) || options[0]).dataset.provider;
  const closeMenu = () => { menu.classList.remove('open'); pill.classList.remove('open'); pill.setAttribute('aria-expanded', 'false'); };

  try {
    const res = await fetch(MODEL_URL, { signal: AbortSignal.timeout(2000) });
    const data = await res.json();
    // Show the REAL local model name (e.g. "qwen2.5:3b") from config.OLLAMA_MODEL
    // so it can never drift out of sync with the backend.
    if (data.ollama_model) {
      document.getElementById('localName').textContent = 'Local \u00b7 ' + data.ollama_model;
    }
    if (data.provider) setActive(data.provider);
  } catch {
    // Backend not up yet - keep the default; checkBackend()'s retry loop
    // sorts out the real status.
  }

  pill.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = !menu.classList.contains('open');
    plusMenu.classList.remove('open'); plusBtn.classList.remove('open');
    menu.classList.toggle('open', open);
    pill.classList.toggle('open', open);
    pill.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', (e) => { if (!menu.contains(e.target) && !pill.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

  for (const opt of options) {
    opt.addEventListener('click', async () => {
      closeMenu();
      if (opt.dataset.provider === activeProvider()) return;
      setActive(opt.dataset.provider); // optimistic - instant feedback
      try {
        await fetch(MODEL_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: opt.dataset.provider })
        });
      } catch {
        // Next chat request just keeps hitting whatever the backend has active.
      }
      setStatus('var(--status-warn)', 'Checking…');
      checkBackend();
    });
  }
}
initModelToggle();

async function askBackendStream(message, onChunk, onStatus, onInbox) {
  const res = await fetch(STREAM_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: SESSION_ID, message })
  });
  if (!res.ok || !res.body) throw new Error('backend error');

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split('\n\n');
    buffer = parts.pop();  // last part may be incomplete — keep it for the next read
    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const payload = part.slice(6);
      if (payload === '[DONE]') return;
      const data = JSON.parse(payload);
      if (data.error) {
        // Distinct from a fetch()/network failure below: the backend
        // definitely responded and started streaming, so this is NOT
        // "offline" — it's a real error surfaced from inside
        // orchestrator.run_stream (see main.py's /chat/stream). Tagged so
        // send()'s catch can show the real message instead of falsely
        // flipping the status to "Offline demo".
        const err = new Error(data.error);
        err.fromBackend = true;
        throw err;
      }
      if (data.inbox) {
        if (onInbox) onInbox(data.inbox);
        continue;
      }
      if (data.status) {
        // Real tool name from orchestrator.run_stream, not a guess from
        // which chip was clicked (see send()'s TOOL_STATUS_LABELS) —
        // accurate even when the model picks a different tool than the
        // shortcut implied.
        onStatus(data.status);
        continue;
      }
      onChunk(data.text);
    }
  }
}

function setGenerating(isGenerating) {
  // Found 2026-09-24: while a reply was streaming, the shortcut chips and
  // the "+" attach menu were still clickable, silently queuing up another
  // request behind the session lock in orchestrator.py with no
  // indication anything was wrong. Disabling these (and input/send)
  // fixes that. (A stop button was also added and then removed the same
  // day — real cancellation of an in-flight response turned out
  // unreliable enough, and the resulting UX bad enough, that the CEO
  // asked for it to be pulled entirely; see CLAUDE.md. This chip/input
  // disabling stands on its own and isn't related to that.)
  input.disabled = isGenerating;
  document.querySelectorAll('.chip').forEach(c => { c.disabled = isGenerating; });  // covers both data-q shortcuts and readFileChip
  plusBtn.disabled = isGenerating;
  const mp = document.getElementById('modelPill'); if (mp) mp.disabled = isGenerating;
  sendBtn.disabled = isGenerating;
}

async function send(v) {
  addMsg(v, 'user');
  setGenerating(true);
  let row = null, b = null, full = '';
  try {
    if (!backendOnline) await checkBackend();  // stale offline status shouldn't stick — re-check every send
    if (backendOnline) {
      try {
        row = document.createElement('div');
        row.className = 'msg assist';
        b = document.createElement('div');
        b.className = 'bubble';
        row.appendChild(b);
        thread.appendChild(row);
        thread.scrollTop = thread.scrollHeight;
        const progress = createProgress(b);
        progress.start();
        let showedCards = false;
        try {
          await askBackendStream(v, (chunk) => {
            full += chunk;
            if (showedCards) return;  // the same summary is already on screen as cards
            progress.stop();
            renderMarkdown(b, full);  // replaces the progress steps with the real content on the first chunk
            thread.scrollTop = thread.scrollHeight;
          }, (tool) => {
            progress.step(TOOL_STATUS_LABELS[tool] || 'Working on it…');
            thread.scrollTop = thread.scrollHeight;
          }, (inbox) => {
            progress.stop();
            showedCards = true;
            renderInboxCards(b, inbox);
            thread.scrollTop = Math.max(0, row.offsetTop - 12);  // start of the answer, not the end of a long one
          });
        } finally {
          progress.stop();
        }
        if (!full) { row.remove(); return; }  // nothing streamed (e.g. a pure tool-call turn that errored) — no empty bubble

        // If the model proposed booking a flight, sending an email, or
        // creating a calendar event, it's fenced as one of these blocks
        // (see orchestrator.py's system prompt) — pull it out of the
        // visible text and render a real approval card instead. At most
        // one is expected per reply, but loop so it's not silently missed
        // if the model ever emits more than one in the same turn.
        const PROPOSAL_BLOCKS = [
          { tag: 'agmc-booking', render: addBookingApproval },
          { tag: 'agmc-send-email', render: addSendEmailApproval },
          { tag: 'agmc-reply-email', render: addReplyEmailApproval },
          { tag: 'agmc-calendar-event', render: addCalendarApproval },
        ];
        let cleaned = full;
        for (const { tag, render } of PROPOSAL_BLOCKS) {
          const match = cleaned.match(new RegExp('```' + tag + '\\s*([\\s\\S]*?)```'));
          if (!match) continue;
          cleaned = (cleaned.slice(0, match.index) + cleaned.slice(match.index + match[0].length)).trim();
          try {
            render(JSON.parse(match[1]));
          } catch {
            // malformed block from the model — leave the text as-is, no card
          }
        }
        if (cleaned !== full) {
          renderMarkdown(b, cleaned);
          thread.scrollTop = thread.scrollHeight;
        }
        // A reply that finished while the panel was already closed (the
        // CEO asked something, then closed the chat before it finished
        // streaming) is the one real "you missed something" case this app
        // can actually produce — surface it instead of silently discarding
        // the answer. Cleared again the moment the panel is reopened (see
        // mascotBtn's click handler).
        attachCopy(row);
        if (!palette.classList.contains('open')) { badge.style.display = 'block'; }
        if (document.getElementById('statusText').textContent !== 'Connected') checkBackend();
        return;
      } catch (e) {
        if (e && e.fromBackend) {
          // The backend definitely responded and started streaming (see
          // askBackendStream) — this is a real error from
          // orchestrator.run_stream, e.g. the Anthropic API itself
          // rejecting the request, not a connectivity problem. Show it
          // plainly instead of flipping to "Offline demo", which used to
          // hide genuine backend errors behind a misleading status.
          if (b) renderMarkdown(b, `⚠️ ${e.message}`);
          checkBackend(true);  // bypass the cached Claude check — this failure is fresh evidence
          return;
        }
        if (row) row.remove();  // drop the stuck "..." loading bubble before falling back to the demo reply
        backendOnline = false;
        setStatus('var(--danger)', 'Offline demo');
      }
    }
    setTimeout(() => respond(v), 380);
  } finally {
    setGenerating(false);
    input.focus();
  }
}

function submit() {
  const v = input.value.trim();
  if (!v) return;
  input.value = '';
  send(v);
}

sendBtn.onclick = submit;
input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
document.querySelectorAll('.chip[data-q]').forEach(c => c.addEventListener('click', () => send(c.dataset.q)));
// Chips that need details from the CEO (who / where / when) only START the
// request: they pre-fill the input and wait, instead of sending made-up specifics.
document.querySelectorAll('.chip[data-fill]').forEach(c => c.addEventListener('click', () => {
  input.value = c.dataset.fill;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}));

// --- File upload ---
const fileInput = document.getElementById('fileInput');
document.getElementById('readFileChip').addEventListener('click', () => fileInput.click());
document.getElementById('plusFileItem').addEventListener('click', () => {
  plusMenu.classList.remove('open');
  plusBtn.classList.remove('open');
  fileInput.click();
});

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  fileInput.value = '';  // reset so picking the same file twice still fires 'change'
  if (!file) return;

  addMsg(`📎 ${file.name}`, 'user');

  if (!backendOnline) await checkBackend();
  if (!backendOnline) {
    addMsg("The backend isn't running, so I can't read files right now — start uvicorn and try again.", 'assist');
    return;
  }

  const formData = new FormData();
  formData.append('session_id', SESSION_ID);
  formData.append('file', file);

  try {
    const res = await fetch(UPLOAD_URL, { method: 'POST', body: formData });
    const data = await res.json();
    if (data.ok) {
      const note = data.truncated ? ' (it was long, so I only kept the first part)' : '';
      addMsg(`Read **${data.filename}**${note}. Ask me anything about it.`, 'assist');
    } else {
      addMsg(`Couldn't read ${file.name}: ${data.error}`, 'assist');
    }
  } catch {
    addMsg('Upload failed — check that the backend is running.', 'assist');
  }
});
